[build-system]
requires = ["scikit-build-core>=0.8", "swig>=4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "oemaestro"
version = "0.9.0"
description = "Native Maestro format parser for OpenEye Toolkits"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["chemistry", "maestro", "schrodinger", "openeye", "cheminformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The floor is set by openeye-toolkits, not by anything in this package: 2026.1
# is the first release with py314 wheels and the first to drop py310, and the
# extension links its OpenEye shared libraries by versioned soname, so the
# runtime toolkit has to be the one the wheel was built against.
requires-python = ">=3.11"
# The oeio floor tracks the CMake pin below: the extension is built against
# oeio v0.6.0's status-returning read API, so an older runtime oeio would not
# match the plugin this wheel registers.
dependencies = ["openeye-toolkits>=2026.1", "rich-click>=1.7", "oeio>=0.6.0"]

[project.scripts]
oemaestro = "oemaestro.cli:main"

[project.entry-points."oeio.plugins"]
oemaestro = "oemaestro"

[project.optional-dependencies]
dev = ["pytest>=7.0", "vrzn>=0.1.0"]

[tool.scikit-build]
cmake.version = ">=3.21"
cmake.build-type = "Release"
build.targets = ["oemaestro_python"]
build-dir = "build/{wheel_tag}"
wheel.install-dir = "."
wheel.py-api = "cp310"
wheel.exclude = ["**.pyc", "**/__pycache__", "*.a", "CMakeFiles/**"]
logging.level = "INFO"
strict-config = false

[tool.scikit-build.cmake.define]
OEMAESTRO_BUILD_TESTS = "OFF"
OEMAESTRO_BUILD_PYTHON = "ON"
OPENEYE_USE_SHARED = "ON"
OEMAESTRO_USE_STABLE_ABI = "ON"
OEMAESTRO_UNIVERSAL2 = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
addopts = "-v"

# =============================================================================
# TOML-driven build configuration for scripts/build_python.py
# =============================================================================
# This section is read by build_python.py to parameterize the build.
# The script itself is identical across all projects — only this config changes.
[tool.oe-build]
package-name = "oemaestro"
cmake-test-flag = "OEMAESTRO_BUILD_TESTS"
rpath-strategy = "platform"  # "platform" = @loader_path/../openeye/libs/{platform}, "simple" = @loader_path

# OpenEye libraries that are expected to be missing from delocate
# (they are provided at runtime by openeye-toolkits, not bundled in the wheel)
expected-missing-libs = [
    "liboechem", "liboesystem", "liboeplatform",
    "liboemath", "libzstd",
]

# Additional CMake defines passed during wheel build (beyond the standard ones)
[tool.oe-build.extra-cmake-defines]

[tool.ruff.lint.per-file-ignores]
"python/oemaestro/__init__.py" = ["E402"]

# ----------------------------------------------------------------------------------------
# Pyright / Pylance configuration (type checking and editor analysis)
# https://microsoft.github.io/pyright/#/configuration
# ----------------------------------------------------------------------------------------
# Restrict analysis to this project's own source so Pylance does not crawl build
# artifacts, scratch data, vendored trees, or the interpreter's site-packages.
# Combined with the editor's workspace diagnostic mode this checks every project
# file (open or not) while keeping memory bounded.
[tool.pyright]
include = ["python", "tests"]
exclude = [
    "**/__pycache__",
    "**/.*",
    "build",
    "build-*",
    "cmake-build-*",
    "dist",
    "**/*.egg-info",
]
